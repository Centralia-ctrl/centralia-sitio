<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Centralia · Nuevas propuestas de bienvenida</title>
<style>
@font-face{font-family:DM;src:url('assets/dm-sans-500.ttf')}@font-face{font-family:DM;src:url('assets/dm-sans-600.ttf');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#303737;font-family:DM,Arial,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #3158db;outline-offset:6px}header{max-width:1400px;margin:auto;padding:30px 5.5%;display:flex;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #edf0f2}.brand{font-size:19px;font-weight:600;letter-spacing:-.04em}.status{font-size:12px;color:#747c7a}nav{display:flex;gap:28px}nav a{color:#78817f;text-decoration:none;font-size:14px;padding:8px 0;border-bottom:2px solid transparent}nav a[aria-current]{color:#303737;border-color:#3158db}.review{max-width:1400px;margin:0 auto;padding:37px 5.5% 20px}.review-top{display:flex;justify-content:space-between;gap:24px;align-items:center}.eyebrow{font-size:12px;color:#747c7a;letter-spacing:.07em;text-transform:uppercase}.frames{display:flex;gap:6px}.frames button{border:0;border-radius:4px;background:transparent;color:#858d8b;padding:8px 12px;font-size:12px}.frames button[aria-pressed=true]{background:#f2f4f8;color:#303737}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4%;min-height:560px}h1{margin:0;font-size:clamp(38px,4.3vw,64px);font-weight:600;line-height:1.17;letter-spacing:-.035em}h1 span{display:block;white-space:nowrap}h1 span:last-child{color:#3158db}.art{display:block;width:100%;height:520px;object-fit:contain}.note{border-top:1px solid #edf0f2;display:flex;justify-content:space-between;gap:40px;padding-top:24px}.note strong{font-size:14px;font-weight:600}.note p{margin:8px 0 0;font-size:13px;line-height:1.6;color:#747c7a;max-width:600px}.note .draft{font-size:12px;color:#858d8b;white-space:nowrap}.reference{color:#747c7a;font-size:12px}.reference a{color:inherit}
@media(max-width:760px){header{padding:22px 6%;align-items:flex-start;flex-direction:column;gap:18px}nav{gap:24px}.review{padding:26px 6%}.hero{grid-template-columns:1fr;gap:8px;min-height:0;padding-top:42px}h1{font-size:9vw}.art{height:auto;aspect-ratio:6/5}.note{gap:16px;flex-direction:column}.review-top{gap:8px}.eyebrow{font-size:10px}.frames button{padding:8px;font-size:11px}.status{font-size:11px}}
</style>
</head>
<body>
<header><div><span class="brand">Centralia</span> <span class="status">&nbsp; / &nbsp; Estudio visual</span></div><nav aria-label="Propuestas"><a href="?producto=credito" data-product="credito">Crédito empresarial</a><a href="?producto=proveedores" data-product="proveedores">Pago a proveedores</a></nav></header>
<main class="review"><div class="review-top"><span class="eyebrow" id="label"></span><div class="frames" aria-label="Texto de la bienvenida"><button type="button" data-frame="0" aria-pressed="true">Frase 1</button><button type="button" data-frame="1" aria-pressed="false">Frase 2</button></div></div><div class="hero"><h1 id="heading"></h1><img class="art" id="art" alt=""></div><div class="note"><div><strong id="concept"></strong><p id="description"></p></div><span class="draft">Propuesta estática · Animación pendiente</span></div><p class="reference">Referencia aprobada: <a href="factoraje.html" target="_blank" rel="noopener">Factoraje ↗</a></p></main>
<script>
const concepts={credito:{label:'Crédito empresarial',frames:[['Dale capital','a tu siguiente','etapa.'],['Invierte en equipo,','inventario y','expansión.']],image:'assets/centralia-credito-concepto-v6.png',alt:'Escultura azul que se despliega para abrir un nuevo espacio.',concept:'Abrir la siguiente etapa.',description:'Una forma continua que se abre. La propuesta de movimiento es un despliegue lento, vinculado al cambio de frase.'},proveedores:{label:'Pago a proveedores',frames:[['Tu siguiente compra','pone todo','en marcha.'],['Financia el pago','a tus proveedores.']],image:'assets/centralia-proveedores-concepto-v6.png',alt:'Dos eslabones rectangulares entrelazados, uno blanco y otro azul, con un detalle dorado.',concept:'Conectar para seguir operando.',description:'Dos eslabones representan la relación entre tu empresa y sus proveedores. La propuesta de movimiento es un giro suave que revele su unión.'}};
const product=new URLSearchParams(location.search).get('producto')==='proveedores'?'proveedores':'credito';const data=concepts[product];document.getElementById('label').textContent=data.label;document.getElementById('concept').textContent=data.concept;document.getElementById('description').textContent=data.description;const artwork=document.getElementById('art');artwork.src=data.image;artwork.alt=data.alt;document.querySelector(`[data-product="${product}"]`).setAttribute('aria-current','page');function frame(index){document.getElementById('heading').replaceChildren(...data.frames[index].map(line=>{const span=document.createElement('span');span.textContent=line;return span}));document.querySelectorAll('[data-frame]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.frame)===index)))}document.querySelectorAll('[data-frame]').forEach(button=>button.addEventListener('click',()=>frame(Number(button.dataset.frame))));frame(0);
</script>
</body>
</html>
