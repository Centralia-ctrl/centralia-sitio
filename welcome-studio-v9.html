<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Centralia · Estudio de movimiento</title><link rel="stylesheet" href="product-scenes-v9.css"><style>@font-face{font-family:DM;src:url(assets/dm-sans-600.ttf);font-weight:600}*{box-sizing:border-box}body{margin:0;background:#fff;color:#303737;font-family:DM,Arial,sans-serif}.studio-nav{display:flex;align-items:center;gap:26px;padding:25px 6%;border-bottom:1px solid #eee;font:14px Arial,sans-serif}.studio-nav a{color:#303737}.studio-nav input{max-width:200px}.solution-film{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5%;margin:0 auto;padding:50px 6%;max-width:1500px;min-height:680px}.copy{display:grid;align-items:center}.film-message{grid-area:1/1;margin:0;font-size:clamp(30px,4.3vw,65px);line-height:1.17;font-weight:600;letter-spacing:-.035em}.film-message span{display:block;white-space:nowrap}.film-message span:last-child{color:#3158db}.product-scene{height:auto}.film-message[data-film-message=second]{opacity:0}@media(max-width:760px){.solution-film{grid-template-columns:1fr;padding:30px 6%;gap:20px}.film-message{font-size:9vw}.studio-nav{flex-wrap:wrap;gap:15px}}</style></head><body><nav class="studio-nav"><a href="?producto=credito">Crédito empresarial</a><a href="?producto=proveedores">Pago a proveedores</a><label>Escena <input data-scene-time aria-label="Momento de la animación" type="range" min="0" max="11.99" step=".01" value="0"></label><button data-scene-play type="button">Reproducir</button><button data-scene-poster type="button">Guardar imagen</button><button data-scene-record type="button">Guardar animación</button></nav><h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Estudio de movimiento de Centralia</h1><main class="solution-film"><div class="copy"></div><div class="product-scene" data-product-scene="credit"></div></main><script>const supplier=new URLSearchParams(location.search).get('producto')==='proveedores';const lines=supplier?[['Tu siguiente compra','pone todo','en marcha.'],['Financia el pago','a tus proveedores.']]:[['Dale capital','a tu siguiente','etapa.'],['Invierte en equipo,','inventario y','expansión.']];document.querySelector('[data-product-scene]').dataset.productScene=supplier?'suppliers':'credit';document.querySelector('.copy').innerHTML=lines.map((row,i)=>'<p class="film-message" data-film-message="'+(i?'second':'first')+'">'+row.map(line=>'<span>'+line+'</span>').join('')+'</p>').join('');</script><script type="module" src="product-scenes-v9.js"></script></body></html>
